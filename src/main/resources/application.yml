spring:

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: dushyantchaudhary122@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true

server:
  port: ${PORT}

upload:
  path: uploads

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY:dummy}
    secret-key: ${R2_SECRET_KEY:dummy}
    account-id: ${R2_ACCOUNT_ID:dummy}
    bucket-name: ${R2_BUCKET_NAME:dap-finance}

onesignal:
